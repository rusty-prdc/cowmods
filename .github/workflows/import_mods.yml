name: Auto Import Mods from Modrinth

on:
  schedule:
    # Запуск каждый день в полночь по UTC
    - cron: '0 0 * * *'
  # Возможность запустить вручную через вкладку Actions
  workflow_dispatch:

jobs:
  run-importer:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Запуск скрипта импорта
        run: python import_mods.py
